services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234aS
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # <-- Ждем, пока база станет healthy!
    environment:
      - DATABASE_URL=postgresql://postgres:1234aS@db:5432/postgres
    restart: on-failure # <-- Если упадет, перезапустится сам

volumes:
  postgres_data: